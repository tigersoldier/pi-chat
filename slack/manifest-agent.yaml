# pi-chat — Slack app manifest (agent messaging experience)
#
# The same app as slack/manifest.yaml, plus Slack's agent surface: DM
# conversations get a timeline, and Slack renders a real status for the agent
# ("processing", "suspended", …) with a stop button while a turn runs.
#
# Read slack/README.md before choosing this one. It needs the agent feature to
# be enabled for the workspace — on a workspace without it, calls fail with
# `feature_disabled`, and switching an app from the legacy assistant view to
# the agent view cannot be reversed.
#
# Docs: docs/slack-app-setup.md

_metadata:
  major_version: 2
  minor_version: 1

display_information:
  name: pi
  description: Drive local pi coding-agent sessions from Slack

features:
  # Declaring the app as an agent is what enables the agent experience. New apps
  # can only use agent_view; the older assistant_view is deprecated. The
  # assistant:write scope below is not what makes this work; see its comment.
  agent_view:
    # 300 characters max
    agent_description: Run local pi coding-agent sessions from Slack.
    # No suggested_prompts here on purpose. A hard-coded list cannot name
    # anything about the machine the bot runs on, so pi-chat sets them at
    # runtime instead: opening the conversation offers work in the
    # repositories that are actually under paths.repos_root
    # (assistant.threads.setSuggestedPrompts, which needs assistant:write
    # below and, in an agent app, must NOT carry thread_ts — Slack documents
    # that including it makes the call fail silently).
  bot_user:
    display_name: pi
    always_online: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /pi
      description: pi-chat control commands, usable in a channel or DM root
      usage_hint: "status | resume | help"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands            # the /pi slash command
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - users:read           # names beside a message, not just the ID
      - assistant:write      # app_context_changed + legacy methods
      - files:read           # phase 3: attachments
      - reactions:write      # phase 3: a 👀 receipt while the agent works
    # Only for the team self-DM mode, where a person's own token drives their
    # own "Notes to self" (docs/slack-user-token-setup.md). Not requested by the
    # app's install link, so a normal install does not ask anyone for these.
    user:
      - im:history          # read the person's own direct messages
      - im:read             # …and see which conversations they are in
      - im:write            # open one when it does not exist yet
      - chat:write          # post in them as the person
      - users:read          # names beside a message, not just the ID

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - app_home_opened      # a DM open; no scope required
      # agent_session_stopped is handled: it is what makes Slack's loading
      # indicator interactive, and pressing it aborts the turn.
      - agent_session_stopped  # the user pressed stop while we were working
      # Declared but unused, kept so that adding them needs no reinstall:
      - app_context_changed  # what the user is viewing; unused
      - agent_session_title_changed  # renamed by the user; unused
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
