<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="pi-gchat avatar">
  <title>pi-gchat</title>
  <desc>A speech bubble containing the monospace prompt "pi>" with a blinking cursor — the pi coding agent speaking in Google Chat.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1b2a3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.92" r="0.75">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "JetBrains Mono", "SF Mono", Consolas, "Roboto Mono", ui-monospace, monospace; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
    </style>
  </defs>

  <!-- rounded-square background, dark slate -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="470" r="200" fill="url(#glow)"/>

  <!-- faint code lines, top -->
  <rect x="156" y="56" width="200" height="14" rx="7" fill="#ffffff" opacity="0.10"/>
  <rect x="196" y="84" width="120" height="10" rx="5" fill="#ffffff" opacity="0.07"/>

  <!-- chat bubble with tail (bottom-left) -->
  <path d="M 128 360 L 96 448 L 208 360 Z" fill="#ffffff"/>
  <rect x="80" y="112" width="352" height="248" rx="52" fill="#ffffff"/>

  <!-- typing dots, top-right inside the bubble -->
  <circle cx="350" cy="150" r="8" fill="#cbd5e1"/>
  <circle cx="378" cy="150" r="8" fill="#cbd5e1"/>
  <circle cx="406" cy="150" r="8" fill="#94a3b8"/>

  <!-- the prompt: pi dark slate, the chevron green -->
  <text x="352" y="250" text-anchor="end" dominant-baseline="central" font-size="120" font-weight="700">
    <tspan fill="#0f172a">pi</tspan><tspan fill="#16a34a">&gt;</tspan>
  </text>

  <!-- blinking cursor block -->
  <rect class="cursor" x="366" y="202" width="18" height="96" rx="9" fill="#16a34a"/>
</svg>
