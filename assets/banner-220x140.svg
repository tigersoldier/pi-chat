<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="220" height="140" role="img" aria-label="pi-gchat app card banner">
  <title>pi-gchat — control your pi coding agent from Google Chat</title>
  <desc>A chat bubble with the prompt "pi>" beside the pi-gchat wordmark on a dark slate gradient.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1b2a3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "JetBrains Mono", "SF Mono", Consolas, "Roboto Mono", ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="220" height="140" fill="url(#bg)"/>
  <rect width="220" height="140" fill="url(#glow)"/>

  <!-- faint code lines, top-right -->
  <rect x="136" y="16" width="52" height="5" rx="2.5" fill="#ffffff" opacity="0.12"/>
  <rect x="156" y="28" width="32" height="4" rx="2" fill="#ffffff" opacity="0.08"/>

  <!-- chat bubble with tail -->
  <path d="M 30 108 L 16 130 L 56 108 Z" fill="#ffffff"/>
  <rect x="16" y="36" width="72" height="72" rx="18" fill="#ffffff"/>

  <!-- prompt inside the bubble -->
  <text x="51" y="72" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="700">
    <tspan fill="#0f172a">pi</tspan><tspan fill="#16a34a">&gt;</tspan>
  </text>

  <!-- cursor -->
  <rect x="78" y="61" width="5" height="22" rx="2.5" fill="#16a34a"/>

  <!-- wordmark + tagline -->
  <text x="104" y="66" text-anchor="start" dominant-baseline="central" font-size="22" font-weight="700">
    <tspan fill="#22c55e">pi</tspan><tspan fill="#ffffff">-gchat</tspan>
  </text>
  <text x="104" y="90" text-anchor="start" dominant-baseline="central" font-size="10" fill="#94a3b8">pi coding agent</text>
</svg>
