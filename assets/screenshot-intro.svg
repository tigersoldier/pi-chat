<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="pi-gchat introduction banner">
  <title>pi-gchat — control your local pi coding agent from Google Chat</title>
  <desc>Introductory banner: pi-gchat wordmark and tagline, a large chat bubble with the prompt "pi>", and the message pipeline Chat to Pub/Sub to pi agent to reply.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1b2a3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.58" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "JetBrains Mono", "SF Mono", Consolas, "Roboto Mono", ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- faint code lines, top corners -->
  <rect x="120" y="90" width="180" height="10" rx="5" fill="#ffffff" opacity="0.08"/>
  <rect x="160" y="115" width="120" height="8" rx="4" fill="#ffffff" opacity="0.06"/>
  <rect x="980" y="90" width="180" height="10" rx="5" fill="#ffffff" opacity="0.08"/>
  <rect x="1000" y="115" width="120" height="8" rx="4" fill="#ffffff" opacity="0.06"/>

  <!-- wordmark -->
  <text x="640" y="150" text-anchor="middle" dominant-baseline="central" font-size="88" font-weight="700">
    <tspan fill="#22c55e">pi</tspan><tspan fill="#ffffff">-gchat</tspan>
  </text>

  <!-- tagline -->
  <text x="640" y="238" text-anchor="middle" dominant-baseline="central" font-size="30" fill="#94a3b8">Control your local pi coding agent from Google Chat</text>

  <!-- hero chat bubble with tail -->
  <path d="M 510 600 L 590 600 L 470 680 Z" fill="#ffffff"/>
  <rect x="490" y="320" width="300" height="280" rx="64" fill="#ffffff"/>

  <!-- typing dots, top-right inside the bubble -->
  <circle cx="725" cy="360" r="7" fill="#cbd5e1"/>
  <circle cx="755" cy="360" r="7" fill="#cbd5e1"/>
  <circle cx="785" cy="360" r="7" fill="#94a3b8"/>

  <!-- prompt inside the bubble -->
  <text x="640" y="455" text-anchor="middle" dominant-baseline="central" font-size="100" font-weight="700">
    <tspan fill="#0f172a">pi</tspan><tspan fill="#16a34a">&gt;</tspan>
  </text>

  <!-- cursor -->
  <rect x="742" y="420" width="15" height="70" rx="7.5" fill="#16a34a"/>

  <!-- message pipeline caption -->
  <text x="640" y="680" text-anchor="middle" dominant-baseline="central" font-size="24">
    <tspan fill="#94a3b8">Chat</tspan><tspan fill="#22c55e"> &#8594; </tspan><tspan fill="#94a3b8">Pub/Sub</tspan><tspan fill="#22c55e"> &#8594; </tspan><tspan fill="#94a3b8">pi agent</tspan><tspan fill="#22c55e"> &#8594; </tspan><tspan fill="#94a3b8">reply</tspan>
  </text>
</svg>
